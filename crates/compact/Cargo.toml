[package]
name = "compact"
version.workspace = true
edition.workspace = true

[[bin]]
name = "compact"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow = "53"
clap = { version = "4", features = ["derive"] }
parquet = { version = "53", features = ["snap"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
