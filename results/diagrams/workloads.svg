<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Card background: self-contained figure for light and dark GitHub themes -->
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <text x="360" y="32" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#24292f" text-anchor="middle">Which workloads get which skips</text>

  <!-- Column headers -->
  <rect x="40" y="52" width="300" height="28" rx="6" fill="#16a34a"/>
  <text x="190" y="71" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Fast: tens of ms</text>

  <rect x="380" y="52" width="300" height="28" rx="6" fill="#dc2626"/>
  <text x="530" y="71" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Slow: seconds to minutes</text>

  <!-- Fast workloads -->
  <rect x="40" y="92" width="300" height="132" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="60" cy="118" r="3" fill="#16a34a"/>
  <text x="72" y="122" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">tight partition (1 file)</text>
  <circle cx="60" cy="144" r="3" fill="#16a34a"/>
  <text x="72" y="148" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">dashboard (1h errors)</text>
  <circle cx="60" cy="170" r="3" fill="#16a34a"/>
  <text x="72" y="174" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">incident (15m window)</text>
  <circle cx="60" cy="196" r="3" fill="#16a34a"/>
  <text x="72" y="200" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">scoped day (payments 5xx)</text>

  <!-- Slow workloads -->
  <rect x="380" y="92" width="300" height="132" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="400" cy="118" r="3" fill="#dc2626"/>
  <text x="412" y="122" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">full scan</text>
  <circle cx="400" cy="144" r="3" fill="#dc2626"/>
  <text x="412" y="148" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">selective 5xx (all data)</text>
  <circle cx="400" cy="170" r="3" fill="#dc2626"/>
  <text x="412" y="174" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">cross-day report</text>
  <circle cx="400" cy="184" r="3" fill="#dc2626"/>
  <text x="412" y="188" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">projection wide</text>
  <circle cx="400" cy="206" r="3" fill="#dc2626"/>
  <text x="412" y="210" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">trace lookup</text>

  <!-- Arrows: straight vertical from box bottom to outcome top -->
  <line x1="190" y1="224" x2="190" y2="256" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="530" y1="224" x2="530" y2="256" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="204" y="242" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#16a34a">partition keys match</text>
  <text x="516" y="242" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#dc2626" text-anchor="end">no partition filter</text>

  <!-- Outcomes -->
  <rect x="40" y="256" width="300" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="280" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">All three skips</text>
  <text x="190" y="300" font-family="system-ui,sans-serif" font-size="11" fill="#24292f" text-anchor="middle">partition prune, column project, row group skip</text>

  <rect x="380" y="256" width="300" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="530" y="280" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">List and read most data</text>
  <text x="530" y="300" font-family="system-ui,sans-serif" font-size="11" fill="#24292f" text-anchor="middle">folder layout cannot narrow the scan</text>
</svg>
