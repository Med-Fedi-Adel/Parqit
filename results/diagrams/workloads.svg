<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="24" y="28" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#0f172a">Workload latency classes</text>

  <text x="120" y="56" font-family="system-ui,sans-serif" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">tens of ms</text>
  <text x="344" y="56" font-family="system-ui,sans-serif" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">seconds to minutes</text>

  <rect x="24" y="72" width="192" height="120" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="120" y="100" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">tight partition</text>
  <text x="120" y="122" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">dashboard, 1h</text>
  <text x="120" y="144" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">incident, 15m</text>
  <text x="120" y="166" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">scoped day</text>

  <rect x="248" y="72" width="192" height="148" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="344" y="100" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">full scan</text>
  <text x="344" y="122" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">selective 5xx</text>
  <text x="344" y="144" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">cross-day report</text>
  <text x="344" y="166" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">projection wide</text>
  <text x="344" y="188" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">trace lookup</text>

  <rect x="496" y="80" width="200" height="56" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="596" y="104" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">All three skips</text>
  <text x="596" y="122" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">partition, column, row group</text>

  <rect x="496" y="160" width="200" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="596" y="184" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">List / read most data</text>
  <text x="596" y="202" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">no partition help</text>

  <line x1="216" y1="120" x2="496" y2="108" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="440" y1="140" x2="496" y2="188" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
